[package]
name = "flowrad-viewer"
version = "0.8.2"
description = "FlowRad Viewer — a free, offline DICOM viewer for Windows, macOS and Linux"
authors = ["FlowRad"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.77"

[lib]
name = "flowrad_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Update rollback and the signed remote config / licence (src/updates.rs):
# the same crates and versions the updater plugin already uses.
minisign-verify = "0.3"
base64 = "0.23"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dicom-object = "0.10"
dicom-core = "0.10"
dicom-dictionary-std = "0.10"
# Deflated Explicit VR LE (some US / SR exports) — read, and re-served inflated.
dicom-transfer-syntax-registry = { version = "0.10", features = ["deflate"] }
# PACS: DIMSE (C-ECHO / C-FIND / C-MOVE + a storage SCP) and DICOMweb (QIDO / WADO-RS).
dicom-ul = "0.10"
dicom-encoding = "0.10"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
walkdir = "2"
rayon = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
parking_lot = "0.12"
percent-encoding = "2"
png = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart", "json", "stream"] }
sysinfo = { version = "0.35", default-features = false, features = ["system"] }
dicom-pixeldata = { version = "0.10", default-features = false, features = ["jpeg", "openjpeg-sys", "rle", "rayon", "charls"] }
memmap2 = "0.9"
# Global allocator: returns freed pages to the OS (purge) instead of keeping
# them committed, so closing a study brings private bytes back to baseline.
mimalloc = { version = "0.1", default-features = false }
libmimalloc-sys = { version = "0.1", default-features = false, features = ["extended"] }
# Phase 2 native renderer (FLOWRAD_NATIVE=1): DX12 on Windows, Metal on macOS, Vulkan/GL on Linux.
wgpu = "30"

# CharLS (JPEG-LS) is C++ built by cmake: in an unoptimised dev build cmake
# picks Debug and the MSVC debug CRT (/MDd), which Rust's release CRT cannot
# link (_CrtDbgReport). Optimising just this package makes it RelWithDebInfo.
[profile.dev.package.charls-sys]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
# WebView2's MemoryUsageTargetLevel (idle footprint). Same versions wry uses.
webview2-com = "0.39"
# Cold start: the native splash (GDI popup, splash.rs) and the early WebView2
# environment (webview2_early.rs). Same version webview2-com uses.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
# Tauri's webview data directory (app_local_data_dir), for the early
# environment: the same crate and version Tauri resolves it with.
dirs = "7"

[target.'cfg(target_os = "macos")'.dependencies]
# AppKit event monitor for side mouse buttons and tilt wheels (mac_mouse.rs).
# Same versions tao / wry already use.
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "NSEvent", "NSResponder", "NSView", "NSWindow", "NSGraphics"] }
# proc_pid_rusage: the process's physical footprint (commit_mb on macOS).
libc = "0.2"
# MTLDevice currentAllocatedSize for the close report (Metal has no wgpu allocator report).
objc2-metal = { version = "0.3", default-features = false, features = ["std", "MTLDevice"] }
# WKWebsiteDataStore: empty WebKit's memory cache when a study closes (mac_webkit.rs).
# Same versions wry already uses.
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSSet", "NSString", "NSDate"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKWebsiteDataRecord"] }

[dev-dependencies]
tempfile = "3"
