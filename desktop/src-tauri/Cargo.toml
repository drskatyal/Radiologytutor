[package]
name = "radlearn-viewer"
version = "0.5.1"
description = "FlowRad Viewer — a free, offline DICOM viewer for Windows, macOS and Linux"
authors = ["FlowRad"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.77"

[lib]
name = "radlearn_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dicom-object = "0.10"
dicom-core = "0.10"
dicom-dictionary-std = "0.10"
# Deflated Explicit VR LE (some US / SR exports) — read, and re-served inflated.
dicom-transfer-syntax-registry = { version = "0.10", features = ["deflate"] }
# PACS: DIMSE (C-ECHO / C-FIND / C-MOVE + a storage SCP) and DICOMweb (QIDO / WADO-RS).
dicom-ul = "0.10"
dicom-encoding = "0.10"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
walkdir = "2"
rayon = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
parking_lot = "0.12"
percent-encoding = "2"
png = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart", "json", "stream"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
# WebView2's MemoryUsageTargetLevel (idle footprint). Same versions wry uses.
webview2-com = "0.39"
windows = "0.62"

[dev-dependencies]
tempfile = "3"
