    <style>
      /* Splash: painted by the webview before any JS runs; React replaces #root's children.
         The FlowRad "Owl Scan" master (brand/owlscan.svg, inline) sits above the
         product name. No fonts, no requests. A real <img>, not a CSS background:
         WebKit holds the first paint until the page is "visually non-empty" (an
         image over 32x32 px, or enough text), and without one it waited for the
         whole JS bundle to load (macOS cold start). A small PNG (112 px, 2x), not the
         SVG: WebKit builds a whole document to draw an SVG <img>, and the paint
         waited ~80 ms after the HTML parsed for it (macOS app share 175 ms). */
      html, body { margin: 0; height: 100%; background: #0b0d10; }
      .boot {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 20px; padding-bottom: 8px;
        font: 600 12px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.18em; text-transform: uppercase; color: #a9c4b9;
      }
    </style>
