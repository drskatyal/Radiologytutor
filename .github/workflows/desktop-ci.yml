# RadLearn Viewer (desktop/) — checks on every PR that touches the desktop app
# or the shared code it imports (lib/, components/ui/).
name: desktop-ci

on:
  pull_request:
    paths:
      - "desktop/**"
      - "lib/**"
      - "components/ui/**"
      - ".github/workflows/desktop-*.yml"
  workflow_dispatch:

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renderer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci --prefix desktop
      - name: Unit tests
        run: npm --prefix desktop test
      - name: Type-check and build the renderer
        run: npm --prefix desktop run build

  shell-and-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: System packages (WebKitGTK, DICOM tools for fixtures, Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            dcmtk libgdcm-tools xvfb
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pydicom numpy scipy pylibjpeg pylibjpeg-openjpeg pylibjpeg-libjpeg pylibjpeg-rle pyjpegls imagecodecs
      - run: npm ci && npm ci --prefix desktop
      - name: Fixtures (every transfer syntax, DICOMDIR, zip, PET/CT)
        run: python3 desktop/scripts/make-fixtures.py --no-download "$RUNNER_TEMP/fixtures"
      - name: Rust tests
        working-directory: desktop/src-tauri
        env:
          RADLEARN_FIXTURES: ${{ runner.temp }}/fixtures
        run: cargo test --lib
      - name: Build the app (debug, embedded renderer)
        run: npx tauri build --debug --no-bundle
        working-directory: desktop
      - name: Open every fixture in the real app
        run: xvfb-run -a desktop/scripts/fixture-matrix.sh desktop/src-tauri/target/debug/radlearn-viewer "$RUNNER_TEMP/fixtures"
