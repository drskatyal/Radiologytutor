# FlowRad Viewer (desktop/) — checks on every PR that touches the desktop app
# or the shared code it imports (lib/, components/ui/).
name: desktop-ci

on:
  pull_request:
    paths:
      - "desktop/**"
      - "lib/**"
      - "components/ui/**"
      - "packages/**"
      - "scripts/make-test-ct.py"
      - ".github/workflows/desktop-*.yml"
  workflow_dispatch:

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renderer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci --prefix desktop
      - name: Unit tests
        run: npm --prefix desktop test
      - name: Type-check and build the renderer
        run: npm --prefix desktop run build

  shell-and-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: System packages (WebKitGTK, DICOM tools for fixtures, Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            dcmtk libgdcm-tools xvfb
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pydicom numpy scipy pylibjpeg pylibjpeg-openjpeg pylibjpeg-libjpeg pylibjpeg-rle pyjpegls imagecodecs
      - run: npm ci && npm ci --prefix desktop
      - name: Voice model (bundled into the renderer build) and speech synthesis for its e2e
        run: |
          sudo apt-get install -y espeak-ng ffmpeg
          python3 scripts/fetch-voice-model.py
          python3 desktop/scripts/make-voice-wav.py "$RUNNER_TEMP/voice.wav" "layout two" "lung window" "zoom in"
      - name: Fixtures (every transfer syntax, DICOMDIR, zip, PET/CT)
        run: python3 desktop/scripts/make-fixtures.py --no-download "$RUNNER_TEMP/fixtures"
      - name: Rust tests
        working-directory: desktop/src-tauri
        env:
          FLOWRAD_FIXTURES: ${{ runner.temp }}/fixtures
        run: cargo test --lib
      - name: P2.1 — native decode of every transfer-syntax fixture (Rust image core)
        working-directory: desktop/src-tauri
        env:
          FLOWRAD_FIXTURES: ${{ runner.temp }}/fixtures
        run: cargo test --lib fixture_matrix -- --ignored --nocapture
      - name: Build the app (debug, embedded renderer)
        run: npx tauri build --debug --no-bundle
        working-directory: desktop
      - name: Open every fixture in the real app
        run: xvfb-run -a desktop/scripts/fixture-matrix.sh desktop/src-tauri/target/debug/flowrad-viewer "$RUNNER_TEMP/fixtures"
      - name: Per-codec decode check (app decoders vs pydicom, bit-exact for lossless)
        run: xvfb-run -a python3 desktop/scripts/codec-check.py desktop/src-tauri/target/debug/flowrad-viewer "$RUNNER_TEMP/fixtures"
      - name: e2e — normal launch paints real pixels in the main viewport
        run: xvfb-run -a python3 desktop/scripts/e2e-paint.py desktop/src-tauri/target/debug/flowrad-viewer
      - name: e2e — quick coronal / sagittal / axial reformat and a MIP slab draw real pixels
        run: |
          xvfb-run -a python3 desktop/scripts/e2e-volume.py desktop/src-tauri/target/debug/flowrad-viewer --view reformat --runs 1
          xvfb-run -a python3 desktop/scripts/e2e-volume.py desktop/src-tauri/target/debug/flowrad-viewer --view coronal --slab mip:20 --runs 1
          xvfb-run -a python3 desktop/scripts/e2e-volume.py desktop/src-tauri/target/debug/flowrad-viewer --view mpr --slab minip:10 --runs 1
      - name: Playwright Chromium (UI e2e)
        run: npx playwright install --with-deps chromium
      - name: e2e — UI with real mouse and keys (active border, series drag-and-drop, RadiAnt keys, shortcut re-mapping, tool cursors, annotation editing)
        run: |
          # The CT phantom plus a coronal reformat (reference lines need non-parallel planes).
          mkdir -p "$RUNNER_TEMP/ui-study" && cp -r "$RUNNER_TEMP/fixtures/ct-phantom/." "$RUNNER_TEMP/ui-study/"
          python3 desktop/scripts/make-ortho-series.py "$RUNNER_TEMP/fixtures/ct-phantom" "$RUNNER_TEMP/ui-study/coronal"
          # Under the production CSP as Tauri modifies it (nonce on script-src / style-src
          # unless opted out): any CSP violation fails the run (HP 0.8.1 inline-style errors).
          node desktop/scripts/e2e-ui.mjs "$RUNNER_TEMP/ui-study" --prod-csp --shots "$RUNNER_TEMP/ui-shots" --voice-wav "$RUNNER_TEMP/voice.wav" --require-voice
          # Voice again under the installed app's production CSP (0.8.1 P0: the
          # recognizer was blocked by it and the mic spun forever).
          node desktop/scripts/e2e-ui.mjs "$RUNNER_TEMP/ui-study" --only voice --prod-csp --voice-wav "$RUNNER_TEMP/voice.wav" --require-voice
          # Multi-monitor: monitor picker, a second window, linked scroll / W/L / reference lines (pretend two-monitor desk).
          node desktop/scripts/e2e-ui.mjs "$RUNNER_TEMP/ui-study" --only multiwindow --shots "$RUNNER_TEMP/ui-shots"
      - name: Upload UI e2e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-ui-e2e
          path: ${{ runner.temp }}/ui-shots
          retention-days: 14

  # The blank-viewport bug was Windows-only (WebView2). Same e2e, on WebView2.
  windows-e2e:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pydicom numpy
      - run: npm ci
      - run: npm ci --prefix desktop
      - name: Rust tests
        working-directory: desktop/src-tauri
        run: cargo test --lib
      # Bundled into this build exactly as in a release, so the voice e2e
      # below runs the real model under the app's production CSP.
      - name: Voice model (bundled, as in a release)
        run: python scripts/fetch-voice-model.py && python scripts/fetch-voice-model.py --check
      - name: Build the app (debug, embedded renderer)
        run: npx tauri build --debug --no-bundle
        working-directory: desktop
      # The JS renderer stays as the fallback after the P2.6 cutover (no GPU
      # adapter, FLOWRAD_NATIVE=0, colour / multi-frame series): this test
      # reads its canvases back and exercises its CPU fallback, so it pins it.
      - name: e2e — normal launch paints real pixels in the main viewport (JS renderer, the fallback)
        env:
          FLOWRAD_NATIVE: "0"
          # WARP runner: an unforced CPU-fallback launch is discarded and
          # repeated (max 2, logged); the check itself is unchanged.
          FLOWRAD_BENCH_WARP_RETRY: "1"
        run: python desktop/scripts/e2e-paint.py desktop/src-tauri/target/debug/flowrad-viewer.exe
      # The default after the cutover: the native renderer, checked on screen.
      - run: pip install pillow
      - name: e2e — normal launch paints the slice natively (screen grab, default renderer)
        shell: bash
        run: |
          python scripts/make-test-ct.py "$RUNNER_TEMP/ct40" --slices 40
          python desktop/scripts/e2e-native.py desktop/src-tauri/target/debug/flowrad-viewer.exe "$RUNNER_TEMP/native-shots" --study "$RUNNER_TEMP/ct40"
      # P0 (0.8.1): the mic spun forever in the installed app — the recognizer
      # worker could not run under the app's CSP. The built app, its production
      # CSP and bundled model: voice must become ready, report download
      # progress, and recognise spoken commands (Windows speech synthesis).
      - name: e2e — voice commands in the built app (ready, progress, spoken commands recognised)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $s.Rate = -2
          $s.SetOutputToWaveFile("$env:RUNNER_TEMP\voice.wav")
          $s.Speak("next series. ")
          $s.Speak("zoom in. ")
          $s.Speak("lung window. ")
          $s.Dispose()
          python desktop/scripts/e2e-voice.py desktop/src-tauri/target/debug/flowrad-viewer.exe "$env:RUNNER_TEMP\ct40" "$env:RUNNER_TEMP\voice.wav"
      # The committed recording (speech through a simulated speaker-to-mic room
      # path; desktop/scripts/make-voice-wav.py --room): every phrase must be
      # recognised and performed, not just one.
      - name: e2e — voice from a fixed recording (next series, zoom in, lung window all recognised)
        shell: pwsh
        run: python desktop/scripts/e2e-voice.py desktop/src-tauri/target/debug/flowrad-viewer.exe "$env:RUNNER_TEMP\ct40" e2e/fixtures/voice/commands-room.wav --expect "next series" "zoom in" "lung window"

  # Performance gate on WebView2 (the platform readers install on), release
  # build, synthetic 848-slice CT (scripts/make-test-ct.py): first image, MPR
  # build time and MPR peak memory of the whole process tree. Budgets live in
  # the env block so a change to them is visible in review. Baseline on this
  # runner (WARP software D3D, 2026-11, e384a4f): cold start 644 ms, first
  # image 591-635 warm / 898 cold, MPR 4.8 s peak 2,108 MB (renderer 746, GPU
  # 1,301), idle CT 258 MB, frames p95 15.7 ms (0 dropped), input->render p95
  # 28 ms, leak test +1,153 MB once / +27 MB per round. Phase 1 (native MPR,
  # volume in Rust): MPR build 0.58 s, peak 595 MB (renderer 78, GPU 26), so
  # the MPR gate is now the 1,200 MB target itself. Budgets = measured plus
  # runner noise, ratcheted toward the targets (cold 500, first image 300 warm,
  # MPR 1,200, idle 400, back to baseline); tighten them when a change earns it.
  # The x64 installer for this exact commit, for benching on real hardware
  # (the HP): the runners have no GPU. Unsigned, no updater artifacts; the
  # release workflow still makes the signed draft releases.
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm ci --prefix desktop
      - name: Voice model (bundled, as in a release)
        shell: bash
        run: python scripts/fetch-voice-model.py && python scripts/fetch-voice-model.py --check
      - name: Build the x64 installer (NSIS setup.exe)
        working-directory: desktop
        shell: bash
        run: npx tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Upload setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: flowrad-viewer-setup-x64-${{ github.event.pull_request.head.sha || github.sha }}
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  perf-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      FIRST_IMAGE_MAX_MS: "1100"
      # First slice on screen (Rust preview or engine paint, whichever first); target 300.
      FIRST_VISIBLE_MAX_MS: "400"
      MPR_MAX_MS: "2000"
      MPR_MAX_MB: "1200"
      IDLE_MAX_MB: "400"
      # WARP (software GPU) on the runner: a JS-renderer run that falls back to
      # the CPU or hits a long one-time engine task is discarded and repeated
      # (max 2, logged); thresholds unchanged. Never set on the HP.
      FLOWRAD_BENCH_WARP_RETRY: "1"
      # CI runner: WebView2 alone takes ~0.4-0.5 s before our page loads, so CI
      # gates the app's own share (window build + page load -> first paint)
      # and keeps the total as a backstop. The 500 ms total is checked on real
      # hardware (HP) before a release is published.
      COLDSTART_MAX_MS: "900"
      COLDSTART_APP_MAX_MS: "150"
      # Freezes, split (CI runner renders with WARP, a software GPU):
      # interaction (scroll / W-L / zoom steps) <= 50 ms; one-time open and
      # start-up tasks (engine start, first render, series list) <= 150 ms.
      # The strict <= 50 ms everywhere is checked on real hardware (HP).
      INTERACTION_MAX_MS: "50"
      OPEN_LONG_TASK_MAX_MS: "150"
      FRAME_P95_MAX_MS: "33"
      DROPPED_MAX: "3"
      LEAK_MAX_MB: "400"
      WINDOW_LEAK_MAX_MB: "60"
      LEAK_ROUND_GROWTH_MAX_MB: "100"
      # 0.8.2 (HP 0.8.1: empty app 362 MB private, CT open 473-497, closed
      # +90 MB): PRIVATE bytes, whole tree. The CT open gate is the HP's own
      # 400 MB; the empty-app gate is this runner's floor (~190 MB on WARP)
      # with headroom; a closed study must give back all but 30 MB.
      BASELINE_PRIVATE_MAX_MB: "240"
      CT_OPEN_PRIVATE_MAX_MB: "400"
      CLOSE_DELTA_MAX_MB: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pydicom numpy pillow
      - run: npm ci
      - run: npm ci --prefix desktop
      - name: Build the app (release, no installer)
        run: npx tauri build --no-bundle
        working-directory: desktop
      # Phase 2 (docs/NATIVE_RENDERER.md), P2.0: the WebView2 UI floor — the
      # whole tree with only the UI in the webview (no image engine) — then the
      # same with the native wgpu surface and its test image, then the
      # compositing e2e (native pixels under the transparent page, page on top).
      - name: P2.0 — WebView2 UI floor (start screen, native mode, whole tree, after 10 s; private gated)
        env:
          FLOWRAD_NATIVE: "1"
        run: node desktop/scripts/bench.mjs idle desktop/src-tauri/target/release/flowrad-viewer.exe --seconds 10 --max-private-mb ${{ env.BASELINE_PRIVATE_MAX_MB }}
      - name: P2.0 — floor + native surface (spike view, whole tree, after 10 s)
        env:
          FLOWRAD_NATIVE: "1"
          FLOWRAD_BENCH_VIEW: native-spike
        run: node desktop/scripts/bench.mjs idle desktop/src-tauri/target/release/flowrad-viewer.exe --seconds 10
      - name: P2.1 — cold start in native mode (native first paint before WebView2 loads; informational)
        env:
          FLOWRAD_NATIVE: "1"
        run: node desktop/scripts/bench.mjs coldstart desktop/src-tauri/target/release/flowrad-viewer.exe --runs 5
      - name: P2.0 e2e — native wgpu surface under a transparent WebView2 (screen grab)
        run: python desktop/scripts/e2e-native.py desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/native-shots"
      - name: Upload the P2.0 screen grab
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-spike-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/native-shots
          if-no-files-found: warn
          retention-days: 14
      - name: Synthetic CT, 848 slices (deterministic)
        run: python scripts/make-test-ct.py "${{ runner.temp }}/ct848" --slices 848
      # Real-size studies (HP: CT 4,332 images, MRI 10,310 images), synthetic
      # and deterministic, cached by the generator's hash.
      - name: Cache large synthetic studies
        id: bigcache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/bigct
            ${{ runner.temp }}/bigmr
          key: big-studies-${{ hashFiles('scripts/make-big-study.py', 'scripts/make-test-ct.py') }}
      - name: Large synthetic CT (4,332 slices) and MRI (10,310 images, 242 series)
        if: steps.bigcache.outputs.cache-hit != 'true'
        run: |
          python scripts/make-big-study.py ct "${{ runner.temp }}/bigct"
          python scripts/make-big-study.py mri "${{ runner.temp }}/bigmr"
      # Done = pixels on screen in every MPR pane and in 3D, measured in the
      # app, from a cold cache while the study is still streaming in.
      - name: e2e (P0) — MPR and 3D draw on a cold, still-streaming open (848-slice CT)
        run: python desktop/scripts/e2e-volume.py desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/ct848"
      - name: e2e (P0) — MPR and 3D draw, cold, on the 4,332-slice CT
        run: python desktop/scripts/e2e-volume.py desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/bigct" --runs 1
      - name: e2e (P0) — MPR and 3D draw, cold, on the 10,310-image MRI (its 3D series)
        env:
          E2E_SCAN_DELAY_US: "0"
        run: python desktop/scripts/e2e-volume.py desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/bigmr" --runs 1
      - name: e2e — quick reformat (coronal, sagittal, axial) draws, cold, on the 4,332-slice CT
        run: python desktop/scripts/e2e-volume.py desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/bigct" --view reformat --runs 1
      - name: e2e — MIP / MinIP / AvgIP slabs draw in MPR and in a reformat (4,332-slice CT)
        run: |
          python desktop/scripts/e2e-volume.py desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/bigct" --view mpr --slab mip:20 --runs 1
          python desktop/scripts/e2e-volume.py desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/bigct" --view axial --slab minip:10 --runs 1
          python desktop/scripts/e2e-volume.py desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/bigct" --view sagittal --slab avg:30 --runs 1
      - name: MPR and 3D peak memory on the 4,332-slice CT (whole process tree)
        shell: bash
        run: |
          node desktop/scripts/bench.mjs mpr desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/bigct" --max-mb ${{ env.MPR_MAX_MB }}
          FLOWRAD_BENCH_VIEW=3d node desktop/scripts/bench.mjs mpr desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/bigct" --max-mb ${{ env.MPR_MAX_MB }}
      - name: Cold open of the 10,310-image MRI (scan + first image)
        run: node desktop/scripts/bench.mjs desktop desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/bigmr" --runs 2 --max-long-task-ms ${{ env.OPEN_LONG_TASK_MAX_MS }}
      - name: P2.1 — native renderer on the 848-slice CT (first image, scroll, whole tree; informational)
        run: node desktop/scripts/bench.mjs native desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/ct848" --runs 3
      - name: P2.2 e2e — the app's first viewport drawn natively (848-slice CT, screen grab)
        run: python desktop/scripts/e2e-native.py desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/native-shots" --study "${{ runner.temp }}/ct848"
      - name: P2.3 e2e — every native tool draws and measures (Length, ROIs with Rust stats, probe, undo / redo)
        run: python desktop/scripts/e2e-native.py desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/native-shots" --study "${{ runner.temp }}/ct848" --tools
      - name: P2.4 e2e — MPR, slabs and quick reformat drawn natively (848-slice CT)
        env:
          FLOWRAD_NATIVE: "1"
        shell: bash
        run: |
          python desktop/scripts/e2e-volume.py desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/ct848" --view mpr --slab mip:20 --runs 1
          python desktop/scripts/e2e-volume.py desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/ct848" --view reformat --runs 1
      - name: P2.5 e2e — MPR and 3D draw natively on a cold open (848-slice CT)
        env:
          FLOWRAD_NATIVE: "1"
        run: python desktop/scripts/e2e-volume.py desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/ct848" --runs 1
      - name: P2.5 — 3D peak and settled memory, native mode (whole process tree; informational)
        env:
          FLOWRAD_NATIVE: "1"
          FLOWRAD_BENCH_VIEW: 3d
        run: node desktop/scripts/bench.mjs mpr desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/ct848" --settle 8
      - name: P2.4 — MPR peak and settled memory, native mode (whole process tree; informational)
        env:
          FLOWRAD_NATIVE: "1"
        run: node desktop/scripts/bench.mjs mpr desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/ct848" --settle 8
      - name: P2.2 — app open + first image, native mode (cold and warm; informational)
        env:
          FLOWRAD_NATIVE: "1"
        run: node desktop/scripts/bench.mjs desktop desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/ct848" --runs 3
      - name: P2.2 — idle with the CT open, native mode (whole process tree working set, after 20 s; informational)
        env:
          FLOWRAD_NATIVE: "1"
          FLOWRAD_BENCH_VIEW: grid
        run: node desktop/scripts/bench.mjs mpr desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/ct848" --settle 20
      - name: Gate — idle after a COLD open, native mode (848-slice CT; no scan cache, OS file cache dropped; whole tree, after 20 s)
        env:
          FLOWRAD_BENCH_VIEW: grid
        run: node desktop/scripts/bench.mjs mpr desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/ct848" --settle 20 --max-settled-mb ${{ env.IDLE_MAX_MB }} --max-settled-private-mb ${{ env.CT_OPEN_PRIVATE_MAX_MB }} --require-no-engine --cold
      - name: Idle after a COLD open of the 10,310-image MRI, native mode (whole tree, after 20 s; informational)
        env:
          FLOWRAD_BENCH_VIEW: grid
        run: node desktop/scripts/bench.mjs mpr desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/bigmr" --settle 20 --cold
      - name: Cold start (median of 5, first paint in-process; app share gated, WebView2 phase logged)
        run: node desktop/scripts/bench.mjs coldstart desktop/src-tauri/target/release/flowrad-viewer.exe --runs 5 --max-ms ${{ env.COLDSTART_MAX_MS }} --max-app-ms ${{ env.COLDSTART_APP_MAX_MS }}
      - name: Open + first image (cold and warm)
        run: node desktop/scripts/bench.mjs desktop desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/ct848" --runs 3 --max-first-image-ms ${{ env.FIRST_IMAGE_MAX_MS }} --max-first-visible-ms ${{ env.FIRST_VISIBLE_MAX_MS }} --max-long-task-ms ${{ env.OPEN_LONG_TASK_MAX_MS }} --require-gpu
      - name: Idle memory with the CT open in 2D (whole process tree, after 20 s)
        env:
          FLOWRAD_BENCH_VIEW: grid
        run: node desktop/scripts/bench.mjs mpr desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/ct848" --settle 20 --max-settled-mb ${{ env.IDLE_MAX_MB }} --max-settled-private-mb ${{ env.CT_OPEN_PRIVATE_MAX_MB }}
      - name: Gate — private bytes over a study's life (empty app, CT open, 30 s after closing it; whole tree)
        run: node desktop/scripts/bench.mjs close desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/ct848" --settle 20 --after-close 30 --max-baseline-private-mb ${{ env.BASELINE_PRIVATE_MAX_MB }} --max-open-private-mb ${{ env.CT_OPEN_PRIVATE_MAX_MB }} --max-close-delta-mb ${{ env.CLOSE_DELTA_MAX_MB }}
      # Informational A/B (never fails the job): WebView2 process model vs
      # idle and MPR memory. The flags are the app's own plus one variant.
      - name: A/B — WebView2 process model vs idle / MPR memory / cold start (informational)
        continue-on-error: true
        shell: bash
        env:
          FLOWRAD_BENCH_VIEW: grid
        run: |
          # Keep going when a variant fails (no report = that flag set breaks the app).
          set +e +o pipefail
          base=$(node -p "require('./desktop/src-tauri/tauri.conf.json').app.windows[0].additionalBrowserArgs")
          exe=desktop/src-tauri/target/release/flowrad-viewer.exe
          for variant in "" "--in-process-gpu" "--enable-features=NetworkServiceInProcess2" "--in-process-gpu --enable-features=NetworkServiceInProcess2"; do
            echo "::group::variant: ${variant:-app defaults}"
            export WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS="$base $variant" VARIANT="${variant:-defaults}"
            FLOWRAD_BENCH_TIMEOUT_MS=60000 FLOWRAD_BENCH_VIEW=grid timeout 150 node desktop/scripts/bench.mjs mpr $exe "${{ runner.temp }}/ct848" --settle 20 | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{if(!s.trim()){console.log(`IDLE ${process.env.VARIANT}: no report`);return}const r=JSON.parse(s);console.log(`IDLE ${process.env.VARIANT||"defaults"}: settled ws ${r.settledWsMb} MB private ${r.settledPrivateMb} MB, ${r.processes} processes`)})'
            FLOWRAD_BENCH_TIMEOUT_MS=60000 FLOWRAD_BENCH_VIEW=mpr timeout 150 node desktop/scripts/bench.mjs mpr $exe "${{ runner.temp }}/ct848" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{if(!s.trim()){console.log(`MPR  ${process.env.VARIANT}: no report`);return}const r=JSON.parse(s);console.log(`MPR  ${process.env.VARIANT||"defaults"}: peak ws ${r.peakWsMb} MB private ${r.peakPrivateMb} MB, ${r.processes} processes`)})'
            timeout 150 node desktop/scripts/bench.mjs coldstart $exe --runs 3 | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{if(s.indexOf("{")<0){console.log(`COLD ${process.env.VARIANT}: no report`);return}const j=s.slice(s.indexOf("{"));const r=JSON.parse(j);console.log(`COLD ${process.env.VARIANT||"defaults"}: first paint median ${r.medianMs} ms, nav start ${r.median?.navStartMs} ms`)})'
            echo "::endgroup::"
          done
      - name: Frame times — scroll 120 slices, zoom, window/level (one step per frame)
        run: node desktop/scripts/bench.mjs interact desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/ct848" --max-frame-p95-ms ${{ env.FRAME_P95_MAX_MS }} --max-dropped ${{ env.DROPPED_MAX }} --max-interaction-ms ${{ env.INTERACTION_MAX_MS }}
      - name: Feature on/off leak test (MPR, 3D, cine, tools, dialogs ×3; whole process tree)
        # Runs even when the frame-time step above fails (software GPU on this runner),
        # so the leak / multi-window / MPR gates are always measured and still gate.
        if: ${{ !cancelled() }}
        run: node desktop/scripts/bench.mjs leak desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/ct848" --rounds 3 --max-leak-mb ${{ env.LEAK_MAX_MB }} --max-round-growth-mb ${{ env.LEAK_ROUND_GROWTH_MAX_MB }}
      - name: Gate — multi-monitor (a second viewer window opens, paints, follows; closing it returns memory)
        # Runs even when the frame-time step above fails (software GPU on this runner),
        # so the leak / multi-window / MPR gates are always measured and still gate.
        if: ${{ !cancelled() }}
        run: node desktop/scripts/bench.mjs multiwindow desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/ct848" --max-window-leak-mb ${{ env.WINDOW_LEAK_MAX_MB }} --max-long-tasks 0
      - name: MPR build time and peak memory (whole process tree)
        # Runs even when the frame-time step above fails (software GPU on this runner),
        # so the leak / multi-window / MPR gates are always measured and still gate.
        if: ${{ !cancelled() }}
        run: node desktop/scripts/bench.mjs mpr desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/ct848" --max-ms ${{ env.MPR_MAX_MS }} --max-mb ${{ env.MPR_MAX_MB }}

  # macOS (0.8.2): the same app on Apple Silicon with the native renderer on
  # Metal (the runner has a real, paravirtualised Apple GPU). Build, smoke and
  # the same gates as perf-windows, with the same thresholds. bench.mjs counts
  # the WKWebView WebContent / GPU / Networking processes (launchd children,
  # not the app's) and gates on their physical footprint (Activity Monitor's
  # "Memory"). Also builds the universal (arm64 + x86_64) .dmg the release
  # ships, so the release leg is proven on every PR.
  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      FIRST_IMAGE_MAX_MS: "1100"
      FIRST_VISIBLE_MAX_MS: "400"
      MPR_MAX_MS: "2000"
      MPR_MAX_MB: "1200"
      IDLE_MAX_MB: "400"
      COLDSTART_MAX_MS: "900"
      COLDSTART_APP_MAX_MS: "150"
      INTERACTION_MAX_MS: "50"
      OPEN_LONG_TASK_MAX_MS: "150"
      FRAME_P95_MAX_MS: "33"
      DROPPED_MAX: "3"
      LEAK_MAX_MB: "400"
      LEAK_ROUND_GROWTH_MAX_MB: "100"
      BASELINE_PRIVATE_MAX_MB: "240"
      CT_OPEN_PRIVATE_MAX_MB: "400"
      CLOSE_DELTA_MAX_MB: "30"
      APP: desktop/src-tauri/target/release/flowrad-viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pydicom numpy pillow
      - run: npm ci
      - run: npm ci --prefix desktop
      # Every step below runs even if a unit test fails (`!cancelled()`), so the
      # build happens and every gate is measured and reported on each run.
      - name: Rust tests
        working-directory: desktop/src-tauri
        run: cargo test --lib
      - name: Voice model (bundled, as in a release)
        if: ${{ !cancelled() }}
        run: python scripts/fetch-voice-model.py && python scripts/fetch-voice-model.py --check
      - name: Build the app (release, no bundle)
        if: ${{ !cancelled() }}
        run: npx tauri build --no-bundle
        working-directory: desktop
      - name: Synthetic CTs (40 and 848 slices, deterministic)
        if: ${{ !cancelled() }}
        run: |
          python scripts/make-test-ct.py "$RUNNER_TEMP/ct40" --slices 40
          python scripts/make-test-ct.py "$RUNNER_TEMP/ct848" --slices 848
      - name: Smoke — launches, the native renderer is ready on Metal, the first image paints
        if: ${{ !cancelled() }}
        run: python desktop/scripts/e2e-native.py "$APP" "$RUNNER_TEMP/native-shots" --study "$RUNNER_TEMP/ct40"
      - name: Gate — empty app (whole tree, physical footprint)
        if: ${{ !cancelled() }}
        run: node desktop/scripts/bench.mjs idle "$APP" --seconds 10 --max-private-mb "$BASELINE_PRIVATE_MAX_MB"
      - name: Gate — cold start
        if: ${{ !cancelled() }}
        run: node desktop/scripts/bench.mjs coldstart "$APP" --runs 5 --max-ms "$COLDSTART_MAX_MS" --max-app-ms "$COLDSTART_APP_MAX_MS"
      - name: Gate — open + first image (cold and warm), no long tasks
        if: ${{ !cancelled() }}
        run: node desktop/scripts/bench.mjs desktop "$APP" "$RUNNER_TEMP/ct848" --runs 3 --max-first-image-ms "$FIRST_IMAGE_MAX_MS" --max-first-visible-ms "$FIRST_VISIBLE_MAX_MS" --max-long-task-ms "$OPEN_LONG_TASK_MAX_MS" --require-gpu
      - name: Gate — idle with the CT open (after 20 s)
        if: ${{ !cancelled() }}
        run: node desktop/scripts/bench.mjs mpr "$APP" "$RUNNER_TEMP/ct848" --settle 20 --max-settled-mb "$IDLE_MAX_MB" --max-settled-private-mb "$CT_OPEN_PRIVATE_MAX_MB"
      - name: Gate — memory back on close (empty app → CT open → 30 s after close)
        if: ${{ !cancelled() }}
        run: node desktop/scripts/bench.mjs close "$APP" "$RUNNER_TEMP/ct848" --settle 20 --after-close 30 --max-baseline-private-mb "$BASELINE_PRIVATE_MAX_MB" --max-open-private-mb "$CT_OPEN_PRIVATE_MAX_MB" --max-close-delta-mb "$CLOSE_DELTA_MAX_MB"
      - name: Gate — frame times (scroll 120 slices, zoom, window/level) and no freezes
        if: ${{ !cancelled() }}
        run: node desktop/scripts/bench.mjs interact "$APP" "$RUNNER_TEMP/ct848" --max-frame-p95-ms "$FRAME_P95_MAX_MS" --max-dropped "$DROPPED_MAX" --max-interaction-ms "$INTERACTION_MAX_MS"
      - name: Gate — feature on/off leak test (MPR, 3D, cine, tools, dialogs ×3)
        if: ${{ !cancelled() }}
        run: node desktop/scripts/bench.mjs leak "$APP" "$RUNNER_TEMP/ct848" --rounds 3 --max-leak-mb "$LEAK_MAX_MB" --max-round-growth-mb "$LEAK_ROUND_GROWTH_MAX_MB"
      - name: Gate — MPR build time and peak memory
        if: ${{ !cancelled() }}
        run: node desktop/scripts/bench.mjs mpr "$APP" "$RUNNER_TEMP/ct848" --max-ms "$MPR_MAX_MS" --max-mb "$MPR_MAX_MB"
      # The release leg: universal binary (Apple Silicon + Intel) in a .dmg,
      # unsigned here (the release workflow signs when the secrets exist).
      - name: Build the universal .dmg (arm64 + x86_64)
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: npx tauri build --target universal-apple-darwin --bundles dmg --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: The .dmg holds a universal binary
        if: ${{ !cancelled() }}
        run: |
          dmg=$(ls desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          echo "dmg: $dmg ($(du -h "$dmg" | cut -f1))"
          mnt=$(hdiutil attach -nobrowse -readonly "$dmg" | tail -1 | awk -F'\t' '{print $NF}')
          bin=$(ls "$mnt"/*.app/Contents/MacOS/* | head -1)
          lipo -info "$bin"
          lipo -info "$bin" | grep -q arm64 && lipo -info "$bin" | grep -q x86_64
          hdiutil detach "$mnt"
      - name: Upload the .dmg
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: flowrad-viewer-macos-universal-${{ github.event.pull_request.head.sha || github.sha }}
          path: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
