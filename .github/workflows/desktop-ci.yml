# FlowRad Viewer (desktop/) — checks on every PR that touches the desktop app
# or the shared code it imports (lib/, components/ui/).
name: desktop-ci

on:
  pull_request:
    paths:
      - "desktop/**"
      - "lib/**"
      - "components/ui/**"
      - "packages/**"
      - "scripts/make-test-ct.py"
      - ".github/workflows/desktop-*.yml"
  workflow_dispatch:

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renderer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci --prefix desktop
      - name: Unit tests
        run: npm --prefix desktop test
      - name: Type-check and build the renderer
        run: npm --prefix desktop run build

  shell-and-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: System packages (WebKitGTK, DICOM tools for fixtures, Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            dcmtk libgdcm-tools xvfb
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pydicom numpy scipy pylibjpeg pylibjpeg-openjpeg pylibjpeg-libjpeg pylibjpeg-rle pyjpegls imagecodecs
      - run: npm ci && npm ci --prefix desktop
      - name: Voice model (bundled into the renderer build) and speech synthesis for its e2e
        run: |
          sudo apt-get install -y espeak-ng ffmpeg
          python3 scripts/fetch-voice-model.py
          python3 desktop/scripts/make-voice-wav.py "$RUNNER_TEMP/voice.wav" "layout two" "lung window" "zoom in"
      - name: Fixtures (every transfer syntax, DICOMDIR, zip, PET/CT)
        run: python3 desktop/scripts/make-fixtures.py --no-download "$RUNNER_TEMP/fixtures"
      - name: Rust tests
        working-directory: desktop/src-tauri
        env:
          FLOWRAD_FIXTURES: ${{ runner.temp }}/fixtures
        run: cargo test --lib
      - name: Build the app (debug, embedded renderer)
        run: npx tauri build --debug --no-bundle
        working-directory: desktop
      - name: Open every fixture in the real app
        run: xvfb-run -a desktop/scripts/fixture-matrix.sh desktop/src-tauri/target/debug/flowrad-viewer "$RUNNER_TEMP/fixtures"
      - name: Per-codec decode check (app decoders vs pydicom, bit-exact for lossless)
        run: xvfb-run -a python3 desktop/scripts/codec-check.py desktop/src-tauri/target/debug/flowrad-viewer "$RUNNER_TEMP/fixtures"
      - name: e2e — normal launch paints real pixels in the main viewport
        run: xvfb-run -a python3 desktop/scripts/e2e-paint.py desktop/src-tauri/target/debug/flowrad-viewer
      - name: e2e — quick coronal / sagittal / axial reformat and a MIP slab draw real pixels
        run: |
          xvfb-run -a python3 desktop/scripts/e2e-volume.py desktop/src-tauri/target/debug/flowrad-viewer --view reformat --runs 1
          xvfb-run -a python3 desktop/scripts/e2e-volume.py desktop/src-tauri/target/debug/flowrad-viewer --view coronal --slab mip:20 --runs 1
          xvfb-run -a python3 desktop/scripts/e2e-volume.py desktop/src-tauri/target/debug/flowrad-viewer --view mpr --slab minip:10 --runs 1
      - name: Playwright Chromium (UI e2e)
        run: npx playwright install --with-deps chromium
      - name: e2e — UI with real mouse and keys (active border, series drag-and-drop, RadiAnt keys, shortcut re-mapping, tool cursors, annotation editing)
        run: |
          # The CT phantom plus a coronal reformat (reference lines need non-parallel planes).
          mkdir -p "$RUNNER_TEMP/ui-study" && cp -r "$RUNNER_TEMP/fixtures/ct-phantom/." "$RUNNER_TEMP/ui-study/"
          python3 desktop/scripts/make-ortho-series.py "$RUNNER_TEMP/fixtures/ct-phantom" "$RUNNER_TEMP/ui-study/coronal"
          node desktop/scripts/e2e-ui.mjs "$RUNNER_TEMP/ui-study" --shots "$RUNNER_TEMP/ui-shots" --voice-wav "$RUNNER_TEMP/voice.wav" --require-voice
      - name: Upload UI e2e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-ui-e2e
          path: ${{ runner.temp }}/ui-shots
          retention-days: 14

  # The blank-viewport bug was Windows-only (WebView2). Same e2e, on WebView2.
  windows-e2e:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pydicom numpy
      - run: npm ci
      - run: npm ci --prefix desktop
      - name: Rust tests
        working-directory: desktop/src-tauri
        run: cargo test --lib
      - name: Build the app (debug, embedded renderer)
        run: npx tauri build --debug --no-bundle
        working-directory: desktop
      - name: e2e — normal launch paints real pixels in the main viewport
        run: python desktop/scripts/e2e-paint.py desktop/src-tauri/target/debug/flowrad-viewer.exe

  # Performance gate on WebView2 (the platform readers install on), release
  # build, synthetic 848-slice CT (scripts/make-test-ct.py): first image, MPR
  # build time and MPR peak memory of the whole process tree. Budgets live in
  # the env block so a change to them is visible in review. Baseline on this
  # runner (WARP software D3D, 2026-11, e384a4f): cold start 644 ms, first
  # image 591-635 warm / 898 cold, MPR 4.8 s peak 2,108 MB (renderer 746, GPU
  # 1,301), idle CT 258 MB, frames p95 15.7 ms (0 dropped), input->render p95
  # 28 ms, leak test +1,153 MB once / +27 MB per round. Phase 1 (native MPR,
  # volume in Rust): MPR build 0.58 s, peak 595 MB (renderer 78, GPU 26), so
  # the MPR gate is now the 1,200 MB target itself. Budgets = measured plus
  # runner noise, ratcheted toward the targets (cold 500, first image 300 warm,
  # MPR 1,200, idle 400, back to baseline); tighten them when a change earns it.
  perf-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      FIRST_IMAGE_MAX_MS: "1100"
      # First slice on screen (Rust preview or engine paint, whichever first); target 300.
      FIRST_VISIBLE_MAX_MS: "400"
      MPR_MAX_MS: "2000"
      MPR_MAX_MB: "1200"
      IDLE_MAX_MB: "400"
      COLDSTART_MAX_MS: "900"
      FRAME_P95_MAX_MS: "33"
      DROPPED_MAX: "3"
      LEAK_MAX_MB: "400"
      LEAK_ROUND_GROWTH_MAX_MB: "100"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pydicom numpy
      - run: npm ci
      - run: npm ci --prefix desktop
      - name: Build the app (release, no installer)
        run: npx tauri build --no-bundle
        working-directory: desktop
      - name: Synthetic CT, 848 slices (deterministic)
        run: python scripts/make-test-ct.py "${{ runner.temp }}/ct848" --slices 848
      # Real-size studies (HP: CT 4,332 images, MRI 10,310 images), synthetic
      # and deterministic, cached by the generator's hash.
      - name: Cache large synthetic studies
        id: bigcache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/bigct
            ${{ runner.temp }}/bigmr
          key: big-studies-${{ hashFiles('scripts/make-big-study.py', 'scripts/make-test-ct.py') }}
      - name: Large synthetic CT (4,332 slices) and MRI (10,310 images, 242 series)
        if: steps.bigcache.outputs.cache-hit != 'true'
        run: |
          python scripts/make-big-study.py ct "${{ runner.temp }}/bigct"
          python scripts/make-big-study.py mri "${{ runner.temp }}/bigmr"
      # Done = pixels on screen in every MPR pane and in 3D, measured in the
      # app, from a cold cache while the study is still streaming in.
      - name: e2e (P0) — MPR and 3D draw on a cold, still-streaming open (848-slice CT)
        run: python desktop/scripts/e2e-volume.py desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/ct848"
      - name: e2e (P0) — MPR and 3D draw, cold, on the 4,332-slice CT
        run: python desktop/scripts/e2e-volume.py desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/bigct" --runs 1
      - name: e2e (P0) — MPR and 3D draw, cold, on the 10,310-image MRI (its 3D series)
        env:
          E2E_SCAN_DELAY_US: "0"
        run: python desktop/scripts/e2e-volume.py desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/bigmr" --runs 1
      - name: e2e — quick reformat (coronal, sagittal, axial) draws, cold, on the 4,332-slice CT
        run: python desktop/scripts/e2e-volume.py desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/bigct" --view reformat --runs 1
      - name: e2e — MIP / MinIP / AvgIP slabs draw in MPR and in a reformat (4,332-slice CT)
        run: |
          python desktop/scripts/e2e-volume.py desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/bigct" --view mpr --slab mip:20 --runs 1
          python desktop/scripts/e2e-volume.py desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/bigct" --view axial --slab minip:10 --runs 1
          python desktop/scripts/e2e-volume.py desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/bigct" --view sagittal --slab avg:30 --runs 1
      - name: MPR and 3D peak memory on the 4,332-slice CT (whole process tree)
        shell: bash
        run: |
          node desktop/scripts/bench.mjs mpr desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/bigct" --max-mb ${{ env.MPR_MAX_MB }}
          FLOWRAD_BENCH_VIEW=3d node desktop/scripts/bench.mjs mpr desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/bigct" --max-mb ${{ env.MPR_MAX_MB }}
      - name: Cold open of the 10,310-image MRI (scan + first image)
        run: node desktop/scripts/bench.mjs desktop desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/bigmr" --runs 2
      - name: Cold start (median of 5, first paint in-process)
        run: node desktop/scripts/bench.mjs coldstart desktop/src-tauri/target/release/flowrad-viewer.exe --runs 5 --max-ms ${{ env.COLDSTART_MAX_MS }}
      - name: Open + first image (cold and warm)
        run: node desktop/scripts/bench.mjs desktop desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/ct848" --runs 3 --max-first-image-ms ${{ env.FIRST_IMAGE_MAX_MS }} --max-first-visible-ms ${{ env.FIRST_VISIBLE_MAX_MS }}
      - name: Idle memory with the CT open in 2D (whole process tree, after 20 s)
        env:
          FLOWRAD_BENCH_VIEW: grid
        run: node desktop/scripts/bench.mjs mpr desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/ct848" --settle 20 --max-settled-mb ${{ env.IDLE_MAX_MB }}
      # Informational A/B (never fails the job): WebView2 process model vs
      # idle and MPR memory. The flags are the app's own plus one variant.
      - name: A/B — WebView2 process model vs idle / MPR memory / cold start (informational)
        continue-on-error: true
        shell: bash
        env:
          FLOWRAD_BENCH_VIEW: grid
        run: |
          # Keep going when a variant fails (no report = that flag set breaks the app).
          set +e +o pipefail
          base=$(node -p "require('./desktop/src-tauri/tauri.conf.json').app.windows[0].additionalBrowserArgs")
          exe=desktop/src-tauri/target/release/flowrad-viewer.exe
          for variant in "" "--in-process-gpu" "--enable-features=NetworkServiceInProcess2" "--in-process-gpu --enable-features=NetworkServiceInProcess2"; do
            echo "::group::variant: ${variant:-app defaults}"
            export WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS="$base $variant"
            FLOWRAD_BENCH_TIMEOUT_MS=60000 FLOWRAD_BENCH_VIEW=grid timeout 150 node desktop/scripts/bench.mjs mpr $exe "${{ runner.temp }}/ct848" --settle 20 | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{if(!s.trim()){console.log(`IDLE ${process.argv[1]}: no report`);return}const r=JSON.parse(s);console.log(`IDLE ${process.argv[1]||"defaults"}: settled ws ${r.settledWsMb} MB private ${r.settledPrivateMb} MB, ${r.processes} processes`)})' "$variant"
            FLOWRAD_BENCH_TIMEOUT_MS=60000 FLOWRAD_BENCH_VIEW=mpr timeout 150 node desktop/scripts/bench.mjs mpr $exe "${{ runner.temp }}/ct848" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{if(!s.trim()){console.log(`MPR  ${process.argv[1]}: no report`);return}const r=JSON.parse(s);console.log(`MPR  ${process.argv[1]||"defaults"}: peak ws ${r.peakWsMb} MB private ${r.peakPrivateMb} MB, ${r.processes} processes`)})' "$variant"
            timeout 150 node desktop/scripts/bench.mjs coldstart $exe --runs 3 | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{if(s.indexOf("{")<0){console.log(`COLD ${process.argv[1]}: no report`);return}const j=s.slice(s.indexOf("{"));const r=JSON.parse(j);console.log(`COLD ${process.argv[1]||"defaults"}: first paint median ${r.medianMs} ms, nav start ${r.median?.navStartMs} ms`)})' "$variant"
            echo "::endgroup::"
          done
      - name: Frame times — scroll 120 slices, zoom, window/level (one step per frame)
        run: node desktop/scripts/bench.mjs interact desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/ct848" --max-frame-p95-ms ${{ env.FRAME_P95_MAX_MS }} --max-dropped ${{ env.DROPPED_MAX }}
      - name: Feature on/off leak test (MPR, 3D, cine, tools, dialogs ×3; whole process tree)
        run: node desktop/scripts/bench.mjs leak desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/ct848" --rounds 3 --max-leak-mb ${{ env.LEAK_MAX_MB }} --max-round-growth-mb ${{ env.LEAK_ROUND_GROWTH_MAX_MB }}
      - name: MPR build time and peak memory (whole process tree)
        run: node desktop/scripts/bench.mjs mpr desktop/src-tauri/target/release/flowrad-viewer.exe "${{ runner.temp }}/ct848" --max-ms ${{ env.MPR_MAX_MS }} --max-mb ${{ env.MPR_MAX_MB }}
