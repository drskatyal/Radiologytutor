# TEMPORARY (claude/084-mac-open diagnosis; removed before hand-off): A/B of
# the macOS frame-time gate with the page painted on the CPU (default) and
# WebKit's GPU painting (FLOWRAD_WEBKIT_GPU_PAINT=1), interleaved. Same
# command and thresholds as desktop-ci.yml. Not authoritative.
name: mac-open-diag

on:
  push:
    branches: [claude/084-mac-open]
    paths:
      - ".github/workflows/mac-open-diag.yml"

concurrency:
  group: mac-open-diag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diag:
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      APP: desktop/src-tauri/target/release/flowrad-viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          shared-key: mac-open-diag
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pydicom numpy pillow
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: python scripts/fetch-voice-model.py
      - run: npx tauri build --no-bundle
        working-directory: desktop
      - run: python scripts/make-test-ct.py "$RUNNER_TEMP/ct848" --slices 848
      - name: frame-time gate, A (CPU painting) / B (GPU painting), interleaved x4
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set +e
          echo "RUNNER $(sysctl -n hw.ncpu) CPUs, $(uptime)"
          for i in 1 2 3 4; do
            for v in A B; do
              if [ "$v" = B ]; then export FLOWRAD_WEBKIT_GPU_PAINT=1; else unset FLOWRAD_WEBKIT_GPU_PAINT; fi
              out=$(node desktop/scripts/bench.mjs interact "$APP" "$RUNNER_TEMP/ct848" --max-frame-p95-ms 33 --max-dropped 3 --max-interaction-ms 50 2>&1)
              rc=$?
              echo "$v#$i rc=$rc $(echo "$out" | grep -o 'frame-time gate failed.*' | head -1)"
              echo "$out" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const i=s.indexOf("{\n");if(i<0)return;try{const r=JSON.parse(s.slice(i, s.indexOf("\n}", i) + 2));console.log(`   frames p95 ${r.frames.p95} over33 ${r.frames.over33} · scroll max ${r.scroll.max} p95 ${r.scroll.p95} · native max ${r.native.max} · slowest ${JSON.stringify(r.slowest)}`)}catch(e){console.log("   (no json)")}})'
            done
          done
      - name: open gate, A / B interleaved x2
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set +e
          for i in 1 2; do
            for v in A B; do
              if [ "$v" = B ]; then export FLOWRAD_WEBKIT_GPU_PAINT=1; else unset FLOWRAD_WEBKIT_GPU_PAINT; fi
              echo "== $v#$i"
              node desktop/scripts/bench.mjs desktop "$APP" "$RUNNER_TEMP/ct848" --runs 3 --max-first-image-ms 1100 --max-first-visible-ms 400 --max-long-task-ms 150 --require-gpu 2>&1 | grep -E "^run [0-9]|open timeline|gate failed" | cut -c1-220
            done
          done
