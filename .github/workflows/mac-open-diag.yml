# TEMPORARY (claude/084-mac-open diagnosis; removed before hand-off): the
# macOS open timeline with the app's main thread watched (FLOWRAD_DIAG=1).
# No gate here is authoritative; desktop-ci.yml is.
name: mac-open-diag

on:
  push:
    branches: [claude/084-mac-open]
    paths:
      - ".github/workflows/mac-open-diag.yml"
      - "desktop/**"

concurrency:
  group: mac-open-diag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diag:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APP: desktop/src-tauri/target/release/flowrad-viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          shared-key: mac-open-diag
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pydicom numpy pillow
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: python scripts/fetch-voice-model.py
      - run: npx tauri build --no-bundle
        working-directory: desktop
      - run: python scripts/make-test-ct.py "$RUNNER_TEMP/ct848" --slices 848
      - name: runner
        run: |
          echo "RUNNER $(sysctl -n hw.ncpu) CPUs, $(uptime)"
          sudo -n true && echo "sudo ok"
          mkdir -p "$RUNNER_TEMP/samples"
      - name: A open gate as CI (CPU painting)
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        continue-on-error: true
        run: node desktop/scripts/bench.mjs desktop "$APP" "$RUNNER_TEMP/ct848" --runs 3 --max-first-image-ms 1100 --max-first-visible-ms 400 --max-long-task-ms 150 --require-gpu
      - name: B open gate as CI, WebKit GPU painting (old)
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        continue-on-error: true
        env:
          FLOWRAD_WEBKIT_GPU_PAINT: "1"
        run: node desktop/scripts/bench.mjs desktop "$APP" "$RUNNER_TEMP/ct848" --runs 3 --max-first-image-ms 1100 --max-first-visible-ms 400 --max-long-task-ms 150 --require-gpu
      - name: A cold start gate as CI (CPU painting)
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        continue-on-error: true
        run: node desktop/scripts/bench.mjs coldstart "$APP" --runs 5 --max-ms 900 --max-app-ms 150
      - name: B cold start gate as CI, WebKit GPU painting (old)
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        continue-on-error: true
        env:
          FLOWRAD_WEBKIT_GPU_PAINT: "1"
        run: node desktop/scripts/bench.mjs coldstart "$APP" --runs 5 --max-ms 900 --max-app-ms 150
      - name: A frame times gate as CI (CPU painting)
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        continue-on-error: true
        run: node desktop/scripts/bench.mjs interact "$APP" "$RUNNER_TEMP/ct848" --max-frame-p95-ms 33 --max-dropped 3 --max-interaction-ms 50
      - name: A open, diag (CPU painting)
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        continue-on-error: true
        env:
          FLOWRAD_DIAG: "1"
          FLOWRAD_BENCH_OUT: ${{ runner.temp }}/d1-open-cpu.jsonl
        run: node desktop/scripts/bench.mjs desktop "$APP" "$RUNNER_TEMP/ct848" --runs 3 --max-first-image-ms 1100 --max-first-visible-ms 400 --max-long-task-ms 150 --require-gpu
      - name: B open, diag, GPU painting
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        continue-on-error: true
        env:
          FLOWRAD_DIAG: "1"
          FLOWRAD_WEBKIT_GPU_PAINT: "1"
          FLOWRAD_BENCH_OUT: ${{ runner.temp }}/d2-open-gpu.jsonl
        run: node desktop/scripts/bench.mjs desktop "$APP" "$RUNNER_TEMP/ct848" --runs 3 --max-first-image-ms 1100 --max-first-visible-ms 400 --max-long-task-ms 150 --require-gpu
      - name: A open, diag, WebContent spindump (CPU painting)
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        continue-on-error: true
        env:
          FLOWRAD_DIAG: "1"
          FLOWRAD_BENCH_OUT: ${{ runner.temp }}/d3-open-cpu-spindump.jsonl
        run: |
          bash desktop/scripts/diag-sample-loop.sh "$RUNNER_TEMP/samples" 60 > "$RUNNER_TEMP/sample-loop.txt" 2>&1 &
          looper=$!
          sleep 2
          node desktop/scripts/bench.mjs desktop "$APP" "$RUNNER_TEMP/ct848" --runs 3 || true
          wait $looper || true
          cat "$RUNNER_TEMP/sample-loop.txt"
      - name: timelines
        if: ${{ !cancelled() }}
        run: python3 desktop/scripts/diag-timeline.py "$RUNNER_TEMP"/d*.jsonl
      - name: spindumps (WebContent main thread)
        if: ${{ !cancelled() }}
        run: |
          ls -la "$RUNNER_TEMP/samples"
          for f in "$RUNNER_TEMP"/samples/wc-*.log; do echo "== $f"; head -5 "$f"; done
          python3 desktop/scripts/diag-spindump.py "$RUNNER_TEMP"/samples/*.spindump.txt
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: mac-open-diag
          path: |
            ${{ runner.temp }}/samples
            ${{ runner.temp }}/*.jsonl
          retention-days: 5
