# TEMPORARY (claude/084-mac-open diagnosis; removed before hand-off): the
# macOS open timeline with the app's main thread watched (FLOWRAD_DIAG=1).
# No gate here is authoritative; desktop-ci.yml is.
name: mac-open-diag

on:
  push:
    branches: [claude/084-mac-open]
    paths:
      - ".github/workflows/mac-open-diag.yml"
      - "desktop/**"

concurrency:
  group: mac-open-diag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diag:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APP: desktop/src-tauri/target/release/flowrad-viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          shared-key: mac-open-diag
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pydicom numpy pillow
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: python scripts/fetch-voice-model.py
      - run: npx tauri build --no-bundle
        working-directory: desktop
      - run: python scripts/make-test-ct.py "$RUNNER_TEMP/ct848" --slices 848
      - name: runner
        run: |
          echo "RUNNER $(sysctl -n hw.ncpu) CPUs, $(uptime)"
          sudo -n true && echo "sudo ok"
          mkdir -p "$RUNNER_TEMP/samples"
      - name: open gate, diag (worker heartbeat)
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        continue-on-error: true
        env:
          FLOWRAD_DIAG: "1"
          FLOWRAD_BENCH_OUT: ${{ runner.temp }}/d1-open.jsonl
        run: node desktop/scripts/bench.mjs desktop "$APP" "$RUNNER_TEMP/ct848" --runs 3 --max-first-image-ms 1100 --max-first-visible-ms 400 --max-long-task-ms 150 --require-gpu
      - name: open, diag, WebKit log stream
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        continue-on-error: true
        env:
          FLOWRAD_DIAG: "1"
          FLOWRAD_BENCH_OUT: ${{ runner.temp }}/d2-open-log.jsonl
        run: |
          log stream --style compact --level debug --predicate 'subsystem == "com.apple.WebKit" OR process == "runningboardd"' > "$RUNNER_TEMP/webkit-log.txt" 2>&1 &
          logger=$!
          sleep 2
          node desktop/scripts/bench.mjs desktop "$APP" "$RUNNER_TEMP/ct848" --runs 3 || true
          sleep 1
          kill $logger || true
          wc -l "$RUNNER_TEMP/webkit-log.txt"
      - name: open, diag, WebContent sampled from page load
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        continue-on-error: true
        env:
          FLOWRAD_DIAG: "1"
          FLOWRAD_DIAG_SAMPLE: "1"
          FLOWRAD_DIAG_SAMPLE_AT: load
          FLOWRAD_DIAG_DIR: ${{ runner.temp }}/samples
          FLOWRAD_BENCH_OUT: ${{ runner.temp }}/d3-open-sample.jsonl
        run: node desktop/scripts/bench.mjs desktop "$APP" "$RUNNER_TEMP/ct848" --runs 2
      - name: timelines
        if: ${{ !cancelled() }}
        run: python3 desktop/scripts/diag-timeline.py "$RUNNER_TEMP"/d*.jsonl
      - name: samples
        if: ${{ !cancelled() }}
        run: |
          ls -la "$RUNNER_TEMP/samples"
          python3 desktop/scripts/diag-samples.py "$RUNNER_TEMP"/samples/sample-*.txt
          for f in "$RUNNER_TEMP"/samples/top-*.txt; do echo "===== $f"; cat "$f"; done
      - name: WebKit log (filtered)
        if: ${{ !cancelled() }}
        run: |
          f="$RUNNER_TEMP/webkit-log.txt"
          echo "lines: $(wc -l < "$f")"
          grep -iE "throttl|suspend|assertion|activitystate|visib|occlu|background|foreground|isinwindow|hidden|layerTreeFreeze|freeze|responsiv|hang|timeout|nap|setIsVisible|didUpdateActivityState|ProcessThrottler|WebContent\[" "$f" | grep -viE "networking|xpcproxy" | cut -c1-260 | head -600
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: mac-open-diag
          path: |
            ${{ runner.temp }}/samples
            ${{ runner.temp }}/*.jsonl
          retention-days: 5
