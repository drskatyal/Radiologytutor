# TEMPORARY (diagnostics): the macOS job's build + the two gates under
# investigation, triggered by pushes to claude/084-mac-last (workflow_dispatch
# is not available to this session). Removed before hand-off.
name: desktop-ci (branch diagnostics, temporary)

on:
  push:
    branches: [claude/084-mac-last]

concurrency:
  group: desktop-ci-diag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      COLDSTART_MAX_MS: "900"
      COLDSTART_APP_MAX_MS: "150"
      INTERACTION_MAX_MS: "50"
      FRAME_P95_MAX_MS: "33"
      DROPPED_MAX: "3"
      APP: desktop/src-tauri/target/release/flowrad-viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pydicom numpy pillow
      - run: npm ci
      - run: npm ci --prefix desktop
      - name: Voice model (bundled, as in a release)
        run: python scripts/fetch-voice-model.py && python scripts/fetch-voice-model.py --check
      - name: Build the app (release, no bundle)
        run: npx tauri build --no-bundle
        working-directory: desktop
      - name: Synthetic CTs
        run: |
          python scripts/make-test-ct.py "$RUNNER_TEMP/ct40" --slices 40
          python scripts/make-test-ct.py "$RUNNER_TEMP/ct848" --slices 848
      - name: Smoke (as in desktop-ci, warms the runner the same way)
        continue-on-error: true
        run: python desktop/scripts/e2e-native.py "$APP" "$RUNNER_TEMP/native-shots" --study "$RUNNER_TEMP/ct40"
      - name: Control — bare WKWebView
        continue-on-error: true
        run: |
          swiftc -O desktop/scripts/wk-baseline.swift -o "$RUNNER_TEMP/wk-baseline"
          for i in 1 2 3 4 5; do echo "control run $i: $("$RUNNER_TEMP/wk-baseline")"; done
      - name: Gate — cold start (same command)
        continue-on-error: true
        run: node desktop/scripts/bench.mjs coldstart "$APP" --runs 5 --max-ms "$COLDSTART_MAX_MS" --max-app-ms "$COLDSTART_APP_MAX_MS"
      - name: DIAG — cold start report lines (trace, page timing)
        continue-on-error: true
        run: |
          for i in 1 2 3 4 5; do
            FLOWRAD_BENCH=1 FLOWRAD_BENCH_EXIT=1 "$APP" > "$RUNNER_TEMP/cs$i.txt" 2>&1 &
            pid=$!
            for t in $(seq 1 60); do grep -q '^FLOWRAD_BENCH ' "$RUNNER_TEMP/cs$i.txt" && break; sleep 0.25; done
            sleep 1; kill $pid 2>/dev/null || true; wait $pid 2>/dev/null || true
            echo "== run $i"
            grep '^FLOWRAD_BENCH ' "$RUNNER_TEMP/cs$i.txt" | sed 's/^FLOWRAD_BENCH //' | python3 -c 'import json,sys; r=json.loads(sys.stdin.read()); print(json.dumps({k:r.get(k) for k in ["windowBuiltMs","webviewBuiltMs","navStartMs","navDoneMs","firstPaintMs","webviewNavStartMs","jsStartMs","gpuWarmMs","nativeFirstPaintMs","pageTiming","trace"]}))' || true
          done
      - name: Gate — frame times (same command), x3
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            echo "== interact run $i"
            node desktop/scripts/bench.mjs interact "$APP" "$RUNNER_TEMP/ct848" --max-frame-p95-ms "$FRAME_P95_MAX_MS" --max-dropped "$DROPPED_MAX" --max-interaction-ms "$INTERACTION_MAX_MS" || echo "run $i FAILED"
          done
