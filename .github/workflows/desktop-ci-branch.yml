# TEMPORARY: desktop-ci.yml with a push trigger for claude/084-mac-open
# (workflow_dispatch is not available to this session). Only the macos job
# is kept; its steps and thresholds are identical. Removed before hand-off.
name: desktop-ci (branch copy, macos only, temporary)

on:
  push:
    branches: [claude/084-mac-open]

concurrency:
  group: desktop-ci-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS (0.8.2): the same app on Apple Silicon with the native renderer on
  # Metal (the runner has a real, paravirtualised Apple GPU). Build, smoke and
  # the same gates as perf-windows, with the same thresholds. bench.mjs counts
  # the WKWebView WebContent / GPU / Networking processes (launchd children,
  # not the app's) and gates on their physical footprint (Activity Monitor's
  # "Memory"). Also builds the universal (arm64 + x86_64) .dmg the release
  # ships, so the release leg is proven on every PR.
  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      FIRST_IMAGE_MAX_MS: "1100"
      FIRST_VISIBLE_MAX_MS: "400"
      MPR_MAX_MS: "2000"
      MPR_MAX_MB: "1200"
      IDLE_MAX_MB: "400"
      COLDSTART_MAX_MS: "900"
      COLDSTART_APP_MAX_MS: "150"
      INTERACTION_MAX_MS: "50"
      OPEN_LONG_TASK_MAX_MS: "150"
      FRAME_P95_MAX_MS: "33"
      DROPPED_MAX: "3"
      LEAK_MAX_MB: "400"
      LEAK_ROUND_GROWTH_MAX_MB: "100"
      BASELINE_PRIVATE_MAX_MB: "240"
      CT_OPEN_PRIVATE_MAX_MB: "400"
      CLOSE_DELTA_MAX_MB: "30"
      APP: desktop/src-tauri/target/release/flowrad-viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pydicom numpy pillow
      - run: npm ci
      - run: npm ci --prefix desktop
      # Every step below runs even if a unit test fails (`!cancelled()`), so the
      # build happens and every gate is measured and reported on each run.
      - name: Rust tests
        working-directory: desktop/src-tauri
        run: cargo test --lib
      - name: Voice model (bundled, as in a release)
        if: ${{ !cancelled() }}
        run: python scripts/fetch-voice-model.py && python scripts/fetch-voice-model.py --check
      - name: Build the app (release, no bundle)
        if: ${{ !cancelled() }}
        run: npx tauri build --no-bundle
        working-directory: desktop
      - name: Synthetic CTs (40 and 848 slices, deterministic)
        if: ${{ !cancelled() }}
        run: |
          python scripts/make-test-ct.py "$RUNNER_TEMP/ct40" --slices 40
          python scripts/make-test-ct.py "$RUNNER_TEMP/ct848" --slices 848
      - name: Smoke — launches, the native renderer is ready on Metal, the first image paints
        if: ${{ !cancelled() }}
        run: python desktop/scripts/e2e-native.py "$APP" "$RUNNER_TEMP/native-shots" --study "$RUNNER_TEMP/ct40"
      # The native splash (splash.rs / mac_splash.rs): on screen before the
      # page's first paint, taken off by the page's splash_done with nothing
      # left over the webview, and off with FLOWRAD_NATIVE_SPLASH=0.
      - name: Smoke — native splash shown first, then dismissed by the page
        if: ${{ !cancelled() }}
        run: python desktop/scripts/e2e-splash.py "$APP"
      - name: Gate — empty app (whole tree, physical footprint)
        if: ${{ !cancelled() }}
        run: node desktop/scripts/bench.mjs idle "$APP" --seconds 10 --max-private-mb "$BASELINE_PRIVATE_MAX_MB"
      # Control, informational: a bare WKWebView app (no FlowRad code) on this
      # runner, same marks as ours, so a cold-start number can be read as
      # "the runner's WebKit" vs "our start-up".
      - name: Control — bare WKWebView start-up on this runner (5 runs; informational)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          swiftc -O desktop/scripts/wk-baseline.swift -o "$RUNNER_TEMP/wk-baseline"
          for i in 1 2 3 4 5; do echo "control run $i: $("$RUNNER_TEMP/wk-baseline")"; done
      - name: Gate — cold start (first visible = native splash or page paint)
        if: ${{ !cancelled() }}
        run: node desktop/scripts/bench.mjs coldstart "$APP" --runs 5 --max-ms "$COLDSTART_MAX_MS" --max-app-ms "$COLDSTART_APP_MAX_MS"
      - name: Gate — open + first image (cold and warm), no long tasks
        if: ${{ !cancelled() }}
        run: node desktop/scripts/bench.mjs desktop "$APP" "$RUNNER_TEMP/ct848" --runs 3 --max-first-image-ms "$FIRST_IMAGE_MAX_MS" --max-first-visible-ms "$FIRST_VISIBLE_MAX_MS" --max-long-task-ms "$OPEN_LONG_TASK_MAX_MS" --require-gpu
      # 2D (grid view), as perf-windows' "Idle memory with the CT open in 2D":
      # without the view the bench opens MPR, which has its own gate below.
      - name: Gate — idle with the CT open in 2D (after 20 s)
        if: ${{ !cancelled() }}
        env:
          FLOWRAD_BENCH_VIEW: grid
        run: node desktop/scripts/bench.mjs mpr "$APP" "$RUNNER_TEMP/ct848" --settle 20 --max-settled-mb "$IDLE_MAX_MB" --max-settled-private-mb "$CT_OPEN_PRIVATE_MAX_MB"
      - name: Gate — memory back on close (empty app → CT open → 30 s after close)
        if: ${{ !cancelled() }}
        run: node desktop/scripts/bench.mjs close "$APP" "$RUNNER_TEMP/ct848" --settle 20 --after-close 30 --max-baseline-private-mb "$BASELINE_PRIVATE_MAX_MB" --max-open-private-mb "$CT_OPEN_PRIVATE_MAX_MB" --max-close-delta-mb "$CLOSE_DELTA_MAX_MB"
      - name: Gate — frame times (scroll 120 slices, zoom, window/level) and no freezes
        if: ${{ !cancelled() }}
        run: node desktop/scripts/bench.mjs interact "$APP" "$RUNNER_TEMP/ct848" --max-frame-p95-ms "$FRAME_P95_MAX_MS" --max-dropped "$DROPPED_MAX" --max-interaction-ms "$INTERACTION_MAX_MS"
      - name: Gate — feature on/off leak test (MPR, 3D, cine, tools, dialogs ×3)
        if: ${{ !cancelled() }}
        run: node desktop/scripts/bench.mjs leak "$APP" "$RUNNER_TEMP/ct848" --rounds 3 --max-leak-mb "$LEAK_MAX_MB" --max-round-growth-mb "$LEAK_ROUND_GROWTH_MAX_MB"
      # Required functional check on Metal: waits for the committed first image
      # before driving the same rotate / flip handles as the toolbar and keys.
      - name: Test hook — rotation / flips drawn, thumbnails, bindings reset to defaults (native renderer on Metal)
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: node desktop/scripts/bench.mjs hooks "$APP" "$RUNNER_TEMP/ct848"
      # The gate is unchanged; the RUNNER lines around it are informational.
      # Identical trees have built this volume in 108 ms and in 2,039 ms on
      # different runners (0.8.3: #272 vs #271), and the WKWebView control
      # above does not track it (the build is file reads + a parallel decode,
      # not WebKit start-up). So the step also prints the runner's load, the
      # busiest processes while the bench runs (e.g. Spotlight indexing the
      # new CT), and a CPU / file-read index taken AFTER the bench, so the
      # gate's own conditions are unchanged. A slow build with a slow index or
      # a busy top is the runner; a slow build on a quiet, normal-speed runner
      # is ours.
      - name: Gate — MPR build time and peak memory
        if: ${{ !cancelled() }}
        run: |
          echo "RUNNER: $(sysctl -n hw.ncpu) CPUs, $(sysctl -n hw.memsize | awk '{printf "%d GB", $1 / 1073741824}'), $(uptime | sed 's/.*load averages*: /load /')"
          top -l 8 -s 1 -o cpu -n 6 -stats pid,command,cpu,mem > "$RUNNER_TEMP/mpr-top.txt" 2>&1 &
          sampler=$!
          rc=0
          node desktop/scripts/bench.mjs mpr "$APP" "$RUNNER_TEMP/ct848" --max-ms "$MPR_MAX_MS" --max-mb "$MPR_MAX_MB" || rc=$?
          wait "$sampler" || true
          echo "RUNNER: busiest processes while the bench ran (top, 1 s apart; the first sample's CPU% is since boot):"
          grep -Ev '^(Processes|SharedLibs|MemRegions|PhysMem|VM|Networks|Disks):|^$' "$RUNNER_TEMP/mpr-top.txt" || true
          python3 - "$RUNNER_TEMP/ct848" <<'PY' || true
          import concurrent.futures, hashlib, os, sys, time
          d, cpus = sys.argv[1], os.cpu_count() or 1
          t = time.perf_counter()
          n = sum(len(open(os.path.join(d, f), "rb").read()) for f in os.listdir(d))
          read_ms = (time.perf_counter() - t) * 1000
          buf = bytes(range(256)) * (1 << 18)  # 64 MB
          t = time.perf_counter()
          hashlib.sha256(buf).digest()
          one_ms = (time.perf_counter() - t) * 1000
          t = time.perf_counter()
          with concurrent.futures.ThreadPoolExecutor(cpus) as ex:  # hashlib drops the GIL
              list(ex.map(lambda _: hashlib.sha256(buf).digest(), range(cpus)))
          all_ms = (time.perf_counter() - t) * 1000
          print(f"RUNNER (after the bench): read the CT's {n >> 20} MB in {read_ms:.0f} ms; "
                f"sha256 of 64 MB in {one_ms:.0f} ms on one core, x{cpus} in parallel in {all_ms:.0f} ms; "
                f"load {os.getloadavg()[0]:.2f}")
          PY
          exit $rc
      # The release leg: universal binary (Apple Silicon + Intel) in a .dmg,
      # unsigned here (the release workflow signs when the secrets exist).
      - name: Build the universal .dmg (arm64 + x86_64)
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: npx tauri build --target universal-apple-darwin --bundles dmg --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: The .dmg holds a universal binary
        if: ${{ !cancelled() }}
        run: |
          dmg=$(ls desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          echo "dmg: $dmg ($(du -h "$dmg" | cut -f1))"
          mnt=$(hdiutil attach -nobrowse -readonly "$dmg" | tail -1 | awk -F'\t' '{print $NF}')
          bin=$(ls "$mnt"/*.app/Contents/MacOS/* | head -1)
          lipo -info "$bin"
          lipo -info "$bin" | grep -q arm64 && lipo -info "$bin" | grep -q x86_64
          hdiutil detach "$mnt"
      - name: Upload the .dmg
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: flowrad-viewer-macos-universal-${{ github.event.pull_request.head.sha || github.sha }}
          path: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
