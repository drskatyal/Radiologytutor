# TEMPORARY (claude/084-mac-start diagnosis; removed before hand-off): the
# macOS start-up and open timelines with FLOWRAD_DIAG=1, plus A/B runs. No
# gate here is authoritative; desktop-ci.yml is.
name: mac-diag

on:
  push:
    branches: [claude/084-mac-start]
    paths:
      - ".github/workflows/mac-diag.yml"
      - ".github/diag/**"
      - "desktop/**"

concurrency:
  group: mac-diag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diag:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APP: desktop/src-tauri/target/release/flowrad-viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          shared-key: mac-diag
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pydicom numpy pillow
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: python scripts/fetch-voice-model.py
      - run: npx tauri build --no-bundle
        working-directory: desktop
      - run: python scripts/make-test-ct.py "$RUNNER_TEMP/ct848" --slices 848
      - name: runner
        run: echo "RUNNER $(sysctl -n hw.ncpu) CPUs, $(uptime)"
      - name: splash smoke
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: python desktop/scripts/e2e-splash.py "$APP"
      - name: WebContent main thread during the boot block (sample)
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        run: |
          for arg in "" "$RUNNER_TEMP/ct848" ""; do
            FLOWRAD_BENCH=1 "$APP" $arg > /dev/null 2>&1 &
            pid=$!
            sleep 1.5
            n=0
            for wc in $(pgrep -f com.apple.WebKit.WebContent); do
              n=$((n+1)); sample "$wc" 2 1 -mayDie -file "$RUNNER_TEMP/wc$n.txt" > /dev/null 2>&1 &
            done
            wait $(jobs -p | grep -v "^$pid$") 2>/dev/null || sleep 2.5
            sleep 0.5
            kill -9 "$pid" || true
            sleep 1
            for k in $(seq 1 $n); do
              echo "===== app $pid (${arg:-no study}), WebContent sample $k"
              awk '/Thread_[0-9]+.*(main-thread|DispatchQueue_1)/{f=1} f&&/^    [0-9]+ Thread_/&&c++>0{exit} f' "$RUNNER_TEMP/wc$k.txt" | sed -E 's/ *\[0x[0-9a-f]+\]//; s/  +/ /g' | awk '{ n=$2+0; if (n >= 20) print substr($0,1,220) }' | head -150
            done
          done
      - name: diag open (first)
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        run: node .github/diag/diag-run.mjs "$APP" 4 "$RUNNER_TEMP/ct848"
      - name: diag cold start (first)
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        run: node .github/diag/diag-run.mjs "$APP" 3
      - name: coldstart gate (as CI)
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        continue-on-error: true
        run: node desktop/scripts/bench.mjs coldstart "$APP" --runs 5 --max-ms 900 --max-app-ms 150
      - name: open gate (as CI)
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        continue-on-error: true
        run: node desktop/scripts/bench.mjs desktop "$APP" "$RUNNER_TEMP/ct848" --runs 3 --max-first-image-ms 1100 --max-first-visible-ms 400 --max-long-task-ms 150 --require-gpu
